# GAT模型配置
model:
  anchor_in_channels: 8
  pattern_in_channels: 8
  hidden_channels: 128
  out_channels: 128
  num_heads: 4
  edge_dim: 3
  dropout: 0.2

# 数据配置 - 所有路径都相对于项目根目录
data:
  root: "data"
  train_meshes:
    - "model/new/artist1-torso-newui.obj"
    - "model/new/artist2-hand-newui.obj" 
    - "model/new/artist3-ear-newui.obj"
  val_meshes:
    - "model/old/artist1-torso-oldui.obj"
    - "model/old/artist2-hand-oldui.obj"
    - "model/old/artist3-ear-oldui.obj"

# 训练配置
training:
  learning_rate: 0.001
  weight_decay: 0.01
  margin: 0.5
  l2_reg_weight: 1e-5
  gradient_clip: 1.0
  epochs: 100
  batch_size: 16
  num_triplets_train: 1000
  num_triplets_val: 200
  patience: 10
  checkpoint_dir: "src/train/training/checkpoints/improved_gat" # 相对于项目根目录
  use_wandb: false
  use_l2_reg: false
