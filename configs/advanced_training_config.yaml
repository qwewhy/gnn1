# 全训练集优化配置 / Full training set optimization configuration
# File: configs/advanced_training_config.yaml

# 基本训练配置 / Basic training configuration
training:
  epochs: 50         # 训练轮数
  batch_size: 8      # 批次大小
  patience: 25       # 耐心值
  gradient_clip: 0.5
  log_interval: 5    # 日志
  checkpoint_dir: 'src/train/training/checkpoints/advanced'
  
  # 验证相关配置 / validation related configuration
  use_validation: false  # 暂时禁用验证
  save_frequency: 10     # 定期保存
  
  # 训练策略 / training strategy
  use_hard_mining: true
  use_advanced_system: true
  use_multi_task_learning: false  # 当前为单任务

  # 基础参数 / Basic parameters
  learning_rate: 0.01    # 学习率
  weight_decay: 0.001    # 权重衰减
  margin: 0.3
  num_triplets_train: 8000  # 增加三元组数量（无验证集消耗）

# 模型配置 / Simplified model configuration
model:
  # 基础编码器配置 / Base encoder configuration
  anchor_in_channels: 8
  pattern_in_channels: 8
  hidden_channels: 32
  out_channels: 64
  num_heads: 2
  edge_dim: 3
  dropout: 0.1

  # 多任务头配置 / Multi-task head configuration
  task_heads:
    binary_tasks: ['topology_binary', 'distortion_binary', 'valence_binary', 'boundary_binary']
    regression_tasks: ['topology_regression', 'geometric_regression', 'regularity_regression', 'overall_regression']
    classification_tasks: ['quality_tier', 'singularity_type', 'boundary_type']

# 三元组挖掘配置 / Triplet mining configuration
mining:
  enabled: true
  mining_type: 'adaptive'
  margin: 0.5
  hard_ratio: 0.4
  semi_hard_ratio: 0.4
  easy_ratio: 0.2
  enable_statistics: true
  log_mining_details: true

# 简化的损失权重 / Simplified loss weights
loss_weights:
  triplet: 1.0
  overall_regression: 0.0
  quality_tier: 0.0
  topology_binary: 0.0
  distortion_binary: 0.0
  valence_binary: 0.0
  boundary_binary: 0.0
  topology_regression: 0.0
  geometric_regression: 0.0
  regularity_regression: 0.0
  singularity_type: 0.0
  boundary_type: 0.0
  use_adaptive_weights: false

# 优化器配置 / Optimizer configuration
optimizer:
  type: 'Adam'
  lr: 0.01
  weight_decay: 0.001

# 调度器配置 / Scheduler configuration
scheduler:
  type: 'StepLR'
  step_size: 15
  gamma: 0.7

# 数据配置 / Data configuration
data:
  root: 'data/processed'

  # 训练网格文件 / Training mesh files
  train_meshes:
    - 'model/stanford-bunny-retopo.obj'
    - 'model/bull-retopo.obj'
    - 'model/octopus-retopo.obj'
    - 'model/new/artist1-torso-newui.obj'
    - 'model/new/artist2-hand-newui.obj'

  # 验证网格文件 / Validation mesh files
  val_meshes: []  # 清空验证网格

  # 数据增强配置 / Data augmentation configuration
  augmentation:
    enabled: false
    rotation: true
    scaling: true
    noise: true

# 评估配置 / Evaluation configuration
evaluation:
  # 评估指标 / Evaluation metrics
  metrics:
    - 'triplet_accuracy'
    - 'mining_success_rate' 
    - 'classification_accuracy'
    - 'regression_mse'
    - 'mAP'                    # 新增：mAP评估
    - 'precision_at_k'         # 新增：Precision@K
    - 'recall_at_k'           # 新增：Recall@K
    - 'ndcg_at_k'            # 新增：NDCG@K

  # 评估频率 / Evaluation frequency
  eval_frequency: 3  # 每3个epoch评估一次（更频繁的检索评估）

  # 检索评估配置 / Retrieval evaluation configuration
  retrieval:
    k_values: [1, 5, 10, 20]
    distance_metric: 'cosine'    # 使用cosine相似度
    normalize_embeddings: true
    max_eval_samples: 500       # 限制评估样本数以节省时间
    batch_size: 16              # 评估批次大小
    save_embeddings: false      # 是否保存嵌入向量
    analyze_failures: true      # 是否分析失败案例

# 实验和日志配置 / Experiment and logging configuration
experiment:
  name: 'advanced_gat_training'
  save_dir: 'experiments/advanced_training'

  # 检查点配置 / Checkpoint configuration
  save_best_only: false
  save_frequency: 10  # 每10个epoch保存一次
  keep_last_n_checkpoints: 3

  # 可视化配置 / Visualization configuration
  visualization:
    enabled: true
    plot_losses: true
    plot_metrics: true
    save_embeddings: true
    embedding_visualization_frequency: 20

  # Wandb配置 / Wandb configuration (可选)
  wandb:
    enabled: false
    project: 'gnn-pattern-retrieval'
    entity: 'your-username'
    tags: ['advanced-training', 'hard-mining', 'multi-task']

# 调试和开发配置 / Debug and development configuration
debug:
  enabled: false

  # 快速运行模式 / Fast run mode
  fast_run:
    enabled: false
    max_epochs: 5
    small_dataset: true
    reduced_batch_size: 8

  # 性能分析 / Performance profiling
  profiling:
    enabled: false
    profile_memory: true
    profile_compute: true

  # 详细日志 / Verbose logging
  verbose_logging:
    model_details: false
    data_details: false
    mining_details: false
    loss_breakdown: true

# 系统配置 / System configuration
system:
  # 设备配置 / Device configuration
  device: 'auto'  # 'auto', 'cuda', 'cpu'
  mixed_precision: false

  # 并行配置 / Parallel configuration
  num_workers: 0
  pin_memory: true

  # 内存管理 / Memory management
  empty_cache_frequency: 50  # 每50个batch清空缓存
  max_memory_usage: 0.9  # 最大GPU内存使用率

# 高级功能配置 / Advanced features configuration
advanced_features:
  # 动态难度调整 / Dynamic difficulty adjustment
  dynamic_mining:
    enabled: false
    adjustment_frequency: 10
    difficulty_schedule: 'linear'  # 'linear', 'exponential', 'step'

  # 课程学习 / Curriculum learning
  curriculum_learning:
    enabled: false
    start_easy: true
    difficulty_increase_rate: 0.1

  # 知识蒸馏 / Knowledge distillation
  knowledge_distillation:
    enabled: false
    teacher_model_path: null
    temperature: 4.0
    alpha: 0.7

  # 模型集成 / Model ensemble
  ensemble:
    enabled: false
    num_models: 3
    ensemble_method: 'voting'  # 'voting', 'averaging'